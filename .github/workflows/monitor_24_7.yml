name: Monitoraggio Cloud 24-7

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '30 */5 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: monitor-cloud-24-7
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Scarica file del progetto
        uses: actions/checkout@v4

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa librerie video e AI YOLOv8 (CPU)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision ultralytics opencv-python-headless requests numpy

      - name: Avvia Monitoraggio 24/7
        env:
          MOLO_CONFIG: ${{ secrets.MOLO_CONFIG }}
        run: python cloud_molo.py

      - name: Riavvia automaticamente il turno successivo (24/7 senza pause)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEND_STARTUP_MSG: "0"
        run: |
          gh workflow run "Monitoraggio Cloud 24-7" --ref ${{ github.ref_name }} || true
